[project]

site_name = "prodockit User Guide"
site_description = "Full setup, authoring, customisation, and testing guide for prodockit-template and other prodockit-based Zensical projects."
site_author = "Mark Buckwell"
site_url = "https://docs.prodockit.org/"
site_dir = "public"

repo_url = "https://github.com/buckwem/prodockit-userguide"
repo_name = "prodockit-userguide"
edit_uri = "edit/main/docs/"

# Single-line, not the triple-quoted block customise.md's own example
# shows: prodockit.pdf substitutes this verbatim into a CSS `content: "..."`
# string for the PDF's running footer (see "Page footer" in customise.md) -
# literal embedded newlines from a multi-line TOML string break that CSS
# declaration, silently dropping the whole footer with no error. Harmless
# multi-line whitespace on the website (its own copy renders through normal
# HTML, which collapses it), so this only shows up in the PDF.
copyright = "Author: Mark Buckwell and contributors. Licensed under the MIT License."

nav = [
  {"Home" = ["index.md"]},
  {"About" = [
    {"1. About this guide" = "about.md"}
  ]},
  {"Install" = [
    {"2. Adoption install" = "adoptioninstall.md"},
    {"3. Bootstrap Install" = "bootstrapinstall.md"},
    {"4. Manual install" = "installtooling.md"},
    {"5. Additional tooling" = "additionaltooling.md"}
  ]},
  {"Edit" = [
    {"6. Start editing" = "startediting.md"}
  ]},
  {"Basics" = [
    {"7. Markdown basics" = "markdown.md"},
    {"8. Zensical basics" = "zensicalbasics.md"},
    {"9. Shell commands" = "shcommands.md"}
  ]},
  {"Customise" = [
    {"10. Customisation" = "customise.md"},
    {"11. Customise document content" = "customisecontent.md"}
  ]},
  {"Build and test" = [
    {"12. Customise build" = "customisebuild.md"},
    {"13. Testing" = "testing.md"}
  ]},
  {"Reference" = [
    {"A. Acronyms" = "acronyms.md"},
