[project]

site_name = "prodockit User Guide"
site_description = "Installation choices, authoring, customisation, building, and publishing for prodockit-based Zensical projects."
site_author = "Mark Buckwell"
site_url = "https://docs.prodockit.org/"
site_dir = "public"

repo_url = "https://github.com/buckwem/prodockit-userguide"
repo_name = "prodockit-userguide"
edit_uri = "edit/main/docs/"

# Single-line, not the triple-quoted block customise.md's own example
# shows: prodockit.pdf substitutes this verbatim into a CSS `content: "..."`
# string for the PDF's running footer (see "Page footer" in customise.md) -
# literal embedded newlines from a multi-line TOML string break that CSS
# declaration, silently dropping the whole footer with no error. Harmless
# multi-line whitespace on the website (its own copy renders through normal
# HTML, which collapses it), so this only shows up in the PDF.
copyright = "Author: Mark Buckwell and contributors. Licensed under the MIT License."

nav = [
  {"Home" = ["index.md"]},
  {"About" = [
    {"1. About this guide" = "about.md"}
  ]},
  {"Getting started" = [
    {"2. Getting started" = "gettingstarted.md"},
    {"3. Additional tooling" = "additionaltooling.md"}
  ]},
  {"Edit" = [
    {"4. Start editing" = "startediting.md"}
  ]},
  {"Basics" = [
    {"5. Markdown basics" = "markdown.md"},
    {"6. Zensical basics" = "zensicalbasics.md"},
    {"7. Shell commands" = "shcommands.md"}
  ]},
  {"Customise" = [
    {"8. Document appearance and structure" = "customise.md"},
    {"9. Prodockit authoring features" = "customisecontent.md"}
  ]},
  {"Build and test" = [
    {"10. Build and publish" = "customisebuild.md"}
  ]},
  {"Reference" = [
    {"A. Acronyms" = "acronyms.md"},
    {"B. Glossary" = "glossary.md"},
    {"C. References" = "references.md"}
  ]}
]

extra_css = [
  "stylesheets/pdk.css",
  "stylesheets/branding.css",
  "stylesheets/extra.css",
]
# MathJax is installed rather than fetched from unpkg - the CDN URL was
# `mathjax@3`, which floats, while `prodockit pdf` renders the PDF through
# tools/mathjax's exactly-pinned install, so the two agreed only by
# coincidence. This copy comes from that same pinned install, so the
# website and the PDF provably typeset through one build. It also removes
# five third-party requests per page carrying a formula (the bundle, plus
# the four .woff fonts CommonHTML fetched at runtime).
#
# Neither file is committed - both are third-party code/generated
# configuration, and a repository is redistribution. `prodockit bootstrap`
# writes them on a developer's machine; CI installs them the same way (see
# .github/workflows/docs.yml, .gitlab-ci.yml) - see docs/customise.md's
# "Extra CSS and JavaScript" for the full reasoning
# (prodockit-extensions#263).
#
# javascripts/mathjax.js MUST be listed BEFORE the bundle: MathJax reads
# `window.MathJax` once, at startup, so a config loaded afterwards is
# ignored. prodockit-extensions#263 hit exactly this in prodockit-template
# - arithmatex's `generic = true` (see markdown_extensions below) wraps
# every formula in a `<div>`/`<span class="arithmatex">`, and without an
# explicit config MathJax's own defaults are not guaranteed to look
# inside it, rendering raw TeX with the build reporting success. This
# config matches the fix there, so the two projects stay in step even
# though this page's own formula was not observed to fail without it.
extra_javascript = [
  "javascripts/pdk.js",
  "javascripts/mathjax.js",
  "javascripts/vendor/mathjax/tex-svg-full.js",
  "javascripts/extra.js"
]

[project.theme]

logo = "assets/logo_black.png"
custom_dir = "overrides"
language = "en"

features = [
    "announce.dismiss",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.theme.icon]
edit = "lucide/pencil"
view = "lucide/eye"
repo = "fontawesome/brands/github"

[project.theme.icon.admonition]
note = "fontawesome/solid/note-sticky"
abstract = "fontawesome/solid/book"
info = "fontawesome/solid/circle-info"
tip = "fontawesome/solid/bullhorn"
success = "fontawesome/solid/check"
question = "fontawesome/solid/circle-question"
warning = "fontawesome/solid/triangle-exclamation"
failure = "fontawesome/solid/bomb"
danger = "fontawesome/solid/skull"
bug = "fontawesome/solid/robot"
example = "fontawesome/solid/flask"
quote = "fontawesome/solid/quote-left"

[project.extra]

# Reference/acronym/glossary list spacing - kept in sync with
# prodockit-template's own copies so acronyms.md/glossary.md/references.md
# demonstrate prodockit.citations/prodockit.glossary with the same tight
# list spacing customise.md documents.
reference_style = "european"
reference_spacing_european = "-0.8em"
reference_indent_global = "1.27cm"
reference_spacing_global = "2em"

# Website and shared heading defaults maintained by Adopt.
heading_numbering = true
website_heading_numbering = true

# Markdown extensions - mirrors prodockit-template's own config, since every
# page here demonstrates one of these features live.
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
smart_enable = "all"
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
options.custom_icons = ["overrides/.icons"]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
[project.markdown_extensions.tables]

# Every prodockit extension, registered the same way prodockit-extensions'
# own docs site registers all of them on itself - prodockit.citations and
# prodockit.bibliography can coexist with no conflict (\citeref{id} vs
# \cite{id}), so there's no need to pick just one.
[project.markdown_extensions."prodockit.headings"]
numbering = "continuous"
[project.markdown_extensions."prodockit.refs"]
[project.markdown_extensions."prodockit.citations"]
[project.markdown_extensions."prodockit.glossary"]
[project.markdown_extensions."prodockit.bibliography"]
[project.markdown_extensions."prodockit.tables"]
[project.markdown_extensions."prodockit.index"]
# Build the PDF's back-of-book index from every \index{Term} marker in the
# content - see prodockit-extensions#55/prodockit.pdf.index.
include = true
title = "Index"
[project.markdown_extensions."prodockit.steps"]
[project.markdown_extensions."prodockit.tree"]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.blocks.caption]
types = [
  { name = "caption" },
  { name = "figure-caption", prefix = "{}.", classes = "prodockit-figure-caption" },
  { name = "table-caption", prefix = "{}.", classes = "prodockit-table-caption" },
]
[project.markdown_extensions.zensical.extensions.glightbox]

[project.markdown_extensions.zensical.extensions.macros]
# macros.py here just re-exports prodockit.zensical_macros.define_env() -
# needed for acronym_style()/glossary_style()/reference_style() (used by
# the Reference pages) - see macros.py's own docstring for why this isn't
# registered via the `modules = [...]` option instead.
module_name = "macros"
on_error_fail = true

