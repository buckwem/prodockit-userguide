[project]

site_name = "prodockit User Guide"
site_description = "Full setup, authoring, customisation, and testing guide for prodockit-template and other prodockit-based Zensical projects."
site_author = "Mark Buckwell"
site_url = "https://github.com/buckwem/prodockit-userguide/"
site_dir = "public"

repo_url = "https://github.com/buckwem/prodockit-userguide"
repo_name = "prodockit-userguide"
edit_uri = "edit/main/docs/"

# Single-line, not the triple-quoted block customise.md's own example
# shows: prodockit.pdf substitutes this verbatim into a CSS `content: "..."`
# string for the PDF's running footer (see "Page footer" in customise.md) -
# literal embedded newlines from a multi-line TOML string break that CSS
# declaration, silently dropping the whole footer with no error. Harmless
# multi-line whitespace on the website (its own copy renders through normal
# HTML, which collapses it), so this only shows up in the PDF.
copyright = "Author: Mark Buckwell and contributors. Licensed under the MIT License."

nav = [
  {"Home" = ["index.md"]},
  {"About" = [
    {"1. About this guide" = "about.md"}
  ]},
  {"Guide" = [
    {"2. Install tooling" = "installtooling.md"},
    {"3. Start editing" = "startediting.md"},
    {"4. Markdown basics" = "markdown.md"},
    {"5. Zensical basics" = "zensicalbasics.md"},
    {"6. Customisation" = "customise.md"},
    {"7. Additional tooling" = "additionaltooling.md"},
    {"8. Shell commands" = "shcommands.md"},
    {"9. Testing" = "testing.md"}
  ]},
  {"Reference" = [
    {"A. Acronyms" = "acronyms.md"},
    {"B. Glossary" = "glossary.md"},
    {"C. References" = "references.md"}
  ]}
]

extra_css = ["stylesheets/extra.css"]
extra_javascript = [
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
  "javascript/extra.js"
]

[project.theme]

logo = "assets/logo_black.png"
custom_dir = "overrides"
language = "en"

features = [
    "announce.dismiss",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.integrate",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.theme.icon]
edit = "lucide/pencil"
view = "lucide/eye"
repo = "fontawesome/brands/github"

[project.theme.icon.admonition]
note = "fontawesome/solid/note-sticky"
abstract = "fontawesome/solid/book"
info = "fontawesome/solid/circle-info"
tip = "fontawesome/solid/bullhorn"
success = "fontawesome/solid/check"
question = "fontawesome/solid/circle-question"
warning = "fontawesome/solid/triangle-exclamation"
failure = "fontawesome/solid/bomb"
danger = "fontawesome/solid/skull"
bug = "fontawesome/solid/robot"
example = "fontawesome/solid/flask"
quote = "fontawesome/solid/quote-left"

[project.extra]
# Overrides `copyright` for the PDF's own running footer only, leaving the
# website's copyright text untouched - adds a "Made with Zensical and
# prodockit" credit line, since the live site's own equivalent credit
# comes from overrides/partials/copyright.html instead (prodockit has no
# reach into the website's own Jinja partials). A real HTML fragment - a
# real <br> forces the line break, and the two <a> links render as real,
# clickable links in the PDF, not flattened to plain text - see
# "Copyright text" in prodockit-extensions' pdf.md. Requires prodockit
# >=0.9.0 (unreleased at time of writing - see prodockit-extensions#88):
# under the previous mechanism (a CSS content string with a literal `\A `
# escape), this same value would render literally instead of as a line
# break with real links.
pdf_copyright = 'Author: Mark Buckwell and contributors. Licensed under the MIT License.<br>Made with <a href="https://zensical.org/">Zensical</a> and <a href="https://buckwem.github.io/prodockit-extensions/">prodockit</a>.'

# Reference/acronym/glossary list spacing - kept in sync with
# prodockit-template's own copies so acronyms.md/glossary.md/references.md
# demonstrate prodockit.citations/prodockit.glossary with the same tight
# list spacing customise.md documents.
reference_style = "european"
reference_spacing_european = "-0.8em"
reference_indent_global = "1.27cm"
reference_spacing_global = "2em"

# PDF page size/margins and running header/footer style - explicitly set to
# match prodockit-template's own values (which are themselves prodockit.pdf's
# defaults), so a reader comparing this guide's PDF against one built from
# the template sees the same page layout.
pdf_page_size = "A4"
pdf_margin_top = "2cm"
pdf_margin_right = "2cm"
pdf_margin_bottom = "2cm"
pdf_margin_left = "2cm"
pdf_header_footer_font_size = "10pt"
pdf_header_footer_color = "#555555"
pdf_header_footer_divider_color = "#e2e8f0"

# Back-of-book index built from every \index{Term} marker in the content -
# see prodockit-extensions#55/prodockit.pdf.index.
pdf_include_index = true

# ----------------------------------------------------------------------------
# Markdown extensions - mirrors prodockit-template's own config, since every
# page here demonstrates one of these features live.
# ----------------------------------------------------------------------------
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
smart_enable = "all"
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
options.custom_icons = ["overrides/.icons"]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
[project.markdown_extensions.tables]

# Every prodockit extension, registered the same way prodockit-extensions'
# own docs site registers all of them on itself - prodockit.citations and
# prodockit.bibliography can coexist with no conflict (\cite{id} vs
# \citebib{id}), so there's no need to pick just one.
[project.markdown_extensions."prodockit.headings"]
numbering = "continuous"
[project.markdown_extensions."prodockit.refs"]
[project.markdown_extensions."prodockit.citations"]
[project.markdown_extensions."prodockit.glossary"]
[project.markdown_extensions."prodockit.bibliography"]
[project.markdown_extensions."prodockit.tables"]
[project.markdown_extensions."prodockit.index"]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.blocks.caption]
types = [
  { name = "caption" },
  { name = "figure-caption", prefix = "{}.", classes = "prodockit-figure-caption" },
  { name = "table-caption", prefix = "{}.", classes = "prodockit-table-caption" },
]
[project.markdown_extensions.zensical.extensions.glightbox]

[project.markdown_extensions.zensical.extensions.macros]
# macros.py here just re-exports prodockit.zensical_macros.define_env() -
# needed for acronym_style()/glossary_style()/reference_style() (used by
# the Reference pages) - see macros.py's own docstring for why this isn't
# registered via the `modules = [...]` option instead.
module_name = "macros"
on_error_fail = true
