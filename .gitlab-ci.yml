# GitLab Pages counterpart of .github/workflows/docs.yml, so this guide can
# be mirrored to a GitLab instance (including Surrey's, which the is_surrey
# branding in macros.py detects from CI_SERVER_HOST).
#
# Kept deliberately in step with the GitHub workflow - see the User Guide's
# own build chapter and prodockit's Continuous integration page for why each
# piece is here.

pages:
  stage: deploy
  image: python:3.13
  # Required for this job to actually be picked up: the University of
  # Surrey's shared runner is restricted to jobs tagged "pages" (its own
  # description says as much) - without this, the job sits "pending"
  # forever, no compatible runner ever claims it, and nothing indicates why.
  # Matches prodockit-template's own .gitlab-ci.yml.
  tags:
    - pages
  # Only one deploy at a time. Two pipelines started close together - a
  # release published shortly after its version-bump push, or two pushes in
  # quick succession - can otherwise both be publishing at once and leave the
  # older build live, with nothing failing to indicate it. GitLab's
  # equivalent of the `concurrency` group in .github/workflows/docs.yml.
  resource_group: pages
  variables:
    # Full history, not GitLab's default shallow clone. The cover page's
    # "Release: ..." line comes from prodockit.zensical_macros' {{ release }},
    # which is `git describe --tags --abbrev=0` - a shallow clone fetches no
    # tags at all, so it would resolve to an empty string and the line would
    # silently disappear. The GitLab counterpart of `fetch-depth: 0` in the
    # GitHub workflow.
    #
    # Note prodockit-template needs none of this: its cover uses the PDF-only
    # {RELEASE} marker, resolved from the releases API rather than git tags.
    GIT_DEPTH: "0"
    # mermaid-cli drives Chrome through Puppeteer to rasterise diagrams for
    # the PDF (WeasyPrint has no JS engine to run Mermaid.js the way the live
    # site does). Point it at the apt-installed Chrome below rather than
    # letting Puppeteer download its own.
    #
    # PUPPETEER_SKIP_DOWNLOAD, not the older
    # PUPPETEER_SKIP_CHROMIUM_DOWNLOAD - Puppeteer renamed it, and
    # mermaid-cli ^11.4.2 resolves to puppeteer 25.x, which honours only the
    # new name. Under the old one the skip silently does nothing and a full
    # Chrome build is downloaded on every run before being discarded.
    #
    # Set here rather than as `export` lines in `script:` so they apply to
    # the whole job regardless of step order.
    PANDOC_VERSION: "3.10.1"   # not the image's - see the comment in .github/workflows/docs.yml
    PUPPETEER_SKIP_DOWNLOAD: "true"
    PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
  script:
    - apt-get update
    - apt-get install -y curl gnupg ca-certificates
    # Upstream release rather than the image's - see PANDOC_VERSION.
    - curl -fsSL -o /tmp/pandoc.deb "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
    - apt-get install -y /tmp/pandoc.deb
    # libpango: WeasyPrint needs it at runtime. GitHub's ubuntu-24.04 image
    # already carries it; this slimmer Debian-based image does not.
    #
    # fonts-inter/fonts-jetbrains-mono: this project's fonts. The website
    # loads them from a CDN at view time, but WeasyPrint has no such fallback
    # - it needs the files installed to embed them, and silently substitutes
    # a generic font rather than erroring if they are missing.
    - apt-get install -y libpango-1.0-0 fonts-inter fonts-jetbrains-mono
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    - curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
    - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list
    - apt-get update
    - apt-get install -y google-chrome-stable
    - npm ci --prefix tools/mermaid
    - npm ci --prefix tools/mathjax
    - pip install -r requirements.txt -r testrequirements.txt
    # Was sync_repo_icon.py, now provided by prodockit itself (#27).
    - prodockit sync-repo
    - prodockit pdf
    - zensical build --clean
    # These check the *built* PDF, so they run after both builds - they fail
    # the pipeline if a Mermaid diagram or a formula reached it as raw source
    # instead of a rendered image (see test/ and issue #23).
    - python -m pytest test/ -v
  pages:
    publish: public
  # Only the default branch. Deliberately *no* `$CI_COMMIT_TAG` rule, though
  # there used to be one, to rebuild the cover page's "Release: ..." line when
  # a release was published.
  #
  # A tag pipeline builds whatever the tag points at, which is not necessarily
  # what `main` points at. Sync the mirror after a release that has since been
  # overtaken by new commits and the tag build runs *after* the branch build,
  # publishing the older tree over the newer one - successfully, with nothing
  # to indicate the site just went backwards (#58).
  #
  # `resource_group: pages` above serialises the two but does not order them:
  # its process mode is GitLab's default, `unordered`, which explicitly does
  # not guarantee which queued job runs first. So push order cannot be relied
  # on to fix this either.
  #
  # Nothing is lost by dropping it. Push tags *before* the branch (see
  # "Mirroring to a second host" in customisebuild.md) and the new tag is
  # already on the remote when this job checks out - GIT_DEPTH: "0" above
  # means `git describe --tags` finds it, so this build carries the correct
  # release number by itself. The tag pipeline was only ever producing a
  # second copy of a result this one already gets right.
  #
  # The GitHub workflow reached the same place by a different route: see the
  # `release:` comment in .github/workflows/docs.yml, where a tag-ref
  # deployment was silently never served at all (#43).
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# GitLab counterpart of .github/workflows/drift.yml - watches for drift
# between the pinned build inputs (requirements.txt - see "Pinning build
# inputs" in customisebuild.md) and whatever is newest on PyPI, by actually
# building the site and PDF twice - once pinned, once upgraded - and diffing
# the result. See prodockit-extensions' own "Version pinning and drift" page
# for the full reasoning.
#
# Two things this project's own config can't provide, and need setting up
# once in the GitLab UI:
#   1. A weekly pipeline schedule targeting this project (Build > Pipeline
#      schedules) - `rules` below only stops this job running on a normal
#      push/tag pipeline, it doesn't create the schedule itself.
#   2. A `DRIFT_TOKEN` CI/CD variable (masked, protected) - a project
#      access token with the `api` scope, so the job can open/update an
#      issue via the GitLab API.
drift:
  image: python:3.13
  rules:
    # Only on the schedule - never on a normal push/tag pipeline.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  allow_failure: true # the job's purpose is the issue it opens, not its own exit status
  variables:
    GIT_DEPTH: "0"
    PANDOC_VERSION: "3.10.1"   # not the image's - see the comment in .github/workflows/docs.yml
    PUPPETEER_SKIP_DOWNLOAD: "true"
    PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
  before_script:
    - apt-get update
    - apt-get install -y curl gnupg ca-certificates jq
    # Upstream release rather than the image's - see PANDOC_VERSION.
    - curl -fsSL -o /tmp/pandoc.deb "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
    - apt-get install -y /tmp/pandoc.deb
    - apt-get install -y libpango-1.0-0 fonts-inter fonts-jetbrains-mono
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    - curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
    - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list
    - apt-get update
    - apt-get install -y google-chrome-stable
    - npm ci --prefix tools/mermaid
    - npm ci --prefix tools/mathjax
  script:
    - pip install -r requirements.txt -r testrequirements.txt
    - PINNED_ZENSICAL=$(pip show zensical | awk '/^Version:/{print $2}')
    - PINNED_WEASYPRINT=$(pip show weasyprint | awk '/^Version:/{print $2}')
    - PINNED_PRODOCKIT=$(pip show prodockit | awk '/^Version:/{print $2}')
    - prodockit pdf # PDF first ...
    - zensical build --clean --strict # ... then the site
    - cp -R public /tmp/pinned-site && cp docs/site_documentation.pdf /tmp/pinned.pdf
    - pip install -qU zensical weasyprint "prodockit[index]"
    - LATEST_ZENSICAL=$(pip show zensical | awk '/^Version:/{print $2}')
    - LATEST_WEASYPRINT=$(pip show weasyprint | awk '/^Version:/{print $2}')
    - LATEST_PRODOCKIT=$(pip show prodockit | awk '/^Version:/{print $2}')
    - prodockit pdf
    - zensical build --clean --strict
    - |
      if [ "$PINNED_ZENSICAL" = "$LATEST_ZENSICAL" ] && [ "$PINNED_WEASYPRINT" = "$LATEST_WEASYPRINT" ] && [ "$PINNED_PRODOCKIT" = "$LATEST_PRODOCKIT" ]; then
        echo "Pins are current."; exit 0
      fi
      CHANGED_FILES=$(diff -rq /tmp/pinned-site public | wc -l | tr -d ' ')
      cmp -s /tmp/pinned.pdf docs/site_documentation.pdf && PDF_RESULT=identical || PDF_RESULT=differs
      BODY="zensical $PINNED_ZENSICAL -> $LATEST_ZENSICAL. weasyprint $PINNED_WEASYPRINT -> $LATEST_WEASYPRINT. prodockit $PINNED_PRODOCKIT -> $LATEST_PRODOCKIT.\n\nPDF: $PDF_RESULT. Website: $CHANGED_FILES files differ.\n\nRun \`prodockit pins\` to take the upgrade, rebuild, and review the diff before committing."
      # One open issue at a time, updated in place rather than a fresh one
      # every week.
      EXISTING=$(curl -sf --header "PRIVATE-TOKEN: $DRIFT_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues?state=opened&search=Dependency+drift" \
        | jq -r '.[0].iid // empty')
      if [ -n "$EXISTING" ]; then
        curl -sf --request POST --header "PRIVATE-TOKEN: $DRIFT_TOKEN" \
          --data-urlencode "body=$BODY" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues/$EXISTING/notes" > /dev/null
      else
        curl -sf --request POST --header "PRIVATE-TOKEN: $DRIFT_TOKEN" \
          --data-urlencode "title=Dependency drift: newer build inputs than the docs pins" \
          --data-urlencode "description=$BODY" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues" > /dev/null
      fi
