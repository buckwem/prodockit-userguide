# Watches for drift between the pinned build inputs (requirements.txt - see
# "Pinning build inputs" in customisebuild.md) and whatever is newest on
# PyPI, by actually building the site and PDF twice - once pinned, once
# upgraded - and diffing the result. A newer package existing is not
# interesting on its own (PyPI already answers that); whether taking it
# would *change what gets published* is the thing worth a human looking at.
# Adapted from prodockit-extensions' own drift.yml - see its "Version
# pinning and drift" page for the full reasoning behind each step.
name: Dependency drift
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write # needed to open/update the drift issue

jobs:
  drift:
    runs-on: ubuntu-24.04
    # Around three minutes, and unattended on a schedule - the run
    # nobody is watching is the one that must not hang.
    timeout-minutes: 20
    env:
      # Same reasoning as docs.yml - needed for prodockit pdf's Mermaid/TeX
      # pre-rendering, both builds below go through it.
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history - {{ release }} on the cover page needs it, same as
          # docs.yml, so a comparison build isn't missing content that would
          # otherwise be there.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: r-lib/actions/setup-pandoc@v2
      # The image's mirrorlist puts `azure.archive.ubuntu.com` first. When
      # that host is down - it was, repeatedly, on 2026-08-18, and it held
      # this workflow for eleven minutes before anyone noticed - apt spends
      # minutes on it before reaching the `archive.ubuntu.com` fallback,
      # which answers in milliseconds throughout. Neither a shorter connect
      # timeout nor fewer retries reached it in reasonable time, so the dead
      # host is taken out of the list instead
      # (prodockit-extensions#478, issue #130).
      #
      # Reported rather than assumed: if the image stops shipping a
      # mirrorlist, or stops using Azure, the run says so and carries on
      # unchanged - a substitution that quietly matched nothing would be
      # worse than either.
      - name: Point apt at a mirror that answers
        timeout-minutes: 2
        run: |
          list=/etc/apt/apt-mirrors.txt
          if [ ! -f "$list" ]; then
            echo "::notice::no $list in this image - apt left as it is"
          elif ! grep -q 'azure.archive.ubuntu.com' "$list"; then
            echo "::notice::$list no longer names Azure - apt left as it is"
          else
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$list"
            echo "mirrorlist now:"; cat "$list"
          fi
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 fonts-inter fonts-jetbrains-mono
        timeout-minutes: 8
      - run: curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor | sudo tee /usr/share/keyrings/google-chrome.gpg > /dev/null
      - run: echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
      - run: sudo apt-get update && sudo apt-get install -y google-chrome-stable
        timeout-minutes: 8
      - run: npm ci --prefix tools/mermaid
      - run: npm ci --prefix tools/mathjax

      - name: Build with the pinned versions
        run: |
          pip install -r requirements.txt -r testrequirements.txt
          echo "PINNED_ZENSICAL=$(pip show zensical | awk '/^Version:/{print $2}')" >> "$GITHUB_ENV"
          echo "PINNED_WEASYPRINT=$(pip show weasyprint | awk '/^Version:/{print $2}')" >> "$GITHUB_ENV"
          echo "PINNED_PRODOCKIT=$(pip show prodockit | awk '/^Version:/{print $2}')" >> "$GITHUB_ENV"
          prodockit pdf # PDF first ...
          zensical build --clean --strict # ... then the site
          cp -R public /tmp/pinned-site
          cp docs/site_documentation.pdf /tmp/pinned.pdf

      - name: Build with the newest versions
        run: |
          pip install -qU zensical weasyprint "prodockit[index]"
          echo "LATEST_ZENSICAL=$(pip show zensical | awk '/^Version:/{print $2}')" >> "$GITHUB_ENV"
          echo "LATEST_WEASYPRINT=$(pip show weasyprint | awk '/^Version:/{print $2}')" >> "$GITHUB_ENV"
          echo "LATEST_PRODOCKIT=$(pip show prodockit | awk '/^Version:/{print $2}')" >> "$GITHUB_ENV"
          prodockit pdf
          zensical build --clean --strict

      - name: Compare and report
        if: env.PINNED_ZENSICAL != env.LATEST_ZENSICAL || env.PINNED_WEASYPRINT != env.LATEST_WEASYPRINT || env.PINNED_PRODOCKIT != env.LATEST_PRODOCKIT
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if cmp -s /tmp/pinned.pdf docs/site_documentation.pdf; then
            PDF_RESULT="identical"
          else
            PDF_RESULT="differs"
          fi
          CHANGED_FILES=$(diff -rq /tmp/pinned-site public | wc -l | tr -d ' ')

          BODY="zensical $PINNED_ZENSICAL -> $LATEST_ZENSICAL. weasyprint $PINNED_WEASYPRINT -> $LATEST_WEASYPRINT. prodockit $PINNED_PRODOCKIT -> $LATEST_PRODOCKIT.

          PDF: $PDF_RESULT. Website: $CHANGED_FILES files differ.

          Run \`prodockit pins\` to take the upgrade, rebuild, and review the diff before committing - see [Pinning build inputs](https://buckwem.github.io/prodockit-userguide/customisebuild/#customisebuild-pinning)."

          # One open issue at a time, updated in place rather than a fresh
          # one every week - a scheduled job that piles up issues trains
          # everyone to ignore it just as surely as one that goes red.
          EXISTING=$(gh issue list --search "Dependency drift in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "Dependency drift: newer build inputs than the docs pins" --body "$BODY"
          fi
