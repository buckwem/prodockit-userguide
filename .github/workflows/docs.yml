name: Documentation
on:
  push:
    branches:
      - main
  # Also redeploy whenever a release is published. The cover page's
  # "Release: <tag>" line comes from prodockit.zensical_macros' {{ release }}
  # (`git describe --tags --abbrev=0`), so it can only ever show a tag that
  # already exists at build time - and a release is normally tagged *after*
  # the commit it points at has been pushed, which is what triggers the
  # deploy above. Without this, the site and PDF sit one release behind
  # until something else happens to redeploy them.
  #
  # A release event runs against refs/tags/<tag> rather than a branch, so
  # this also needs a matching `tag: *.*.*` entry alongside `branch: main`
  # in the github-pages environment's deployment branch policies - without
  # it the run is rejected at the environment gate instead of deploying.
  #
  # Same fix as prodockit-extensions#127; the tag pattern differs because
  # this project's tags are bare versions (1.1.0), not prodockit-v1.1.0.
  release:
    types: [published]
  workflow_dispatch:

# Publishing a release right after merging its version bump starts two
# deploys at once - one for the push, one for the release - and without a
# concurrency group they race. That happened to prodockit-extensions on its
# 0.15.1 release: the push run had checked out main before the tag existed,
# so its build saw the *previous* tag, and its deployment is the one that
# ended up live even though the release run started later, finished later,
# and reported success. Nothing failed; the site simply showed the wrong
# release number until someone noticed.
#
# `cancel-in-progress: false` rather than true: a queued deploy should wait
# and then supersede, not be discarded - losing the *later* deploy is
# exactly the failure here. Same pairing as GitHub's own Pages starter
# workflow. See prodockit-extensions#134.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      # Only needed so `prodockit pdf` can pre-render ```mermaid fenced code
      # blocks to static images via mermaid-cli/Puppeteer, and TeX maths
      # ($...$/$$...$$) to static images via mathjax-full (pure Node, no
      # browser needed for that one) - WeasyPrint has no JS engine to run
      # Mermaid.js/MathJax client-side like the live Zensical site does.
      # Without these, prodockit.pdf silently leaves both unrendered and the
      # PDF shows raw diagram/LaTeX source instead - see issue #23. Using the
      # apt-installed Google Chrome below instead of Puppeteer's own bundled
      # download avoids guessing at headless-Chrome shared-library package
      # names.
      #
      # PUPPETEER_SKIP_DOWNLOAD, not the older
      # PUPPETEER_SKIP_CHROMIUM_DOWNLOAD - Puppeteer renamed it, and
      # mermaid-cli ^11.4.2 resolves to puppeteer 25.x, which only honours
      # the new name. Using the old name silently downloads a full Chrome
      # build on every run before falling back to the apt one below.
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
        with:
          # Full history, not the default shallow clone - `{{ release }}`
          # comes from `git describe --tags`, which sees no tags at all in a
          # depth-1 checkout (prodockit-extensions#122).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: r-lib/actions/setup-pandoc@v2
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0
      - run: curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor | sudo tee /usr/share/keyrings/google-chrome.gpg > /dev/null
      - run: echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
      - run: sudo apt-get update && sudo apt-get install -y google-chrome-stable
      - run: npm ci --prefix tools/mermaid
      - run: npm ci --prefix tools/mathjax
      - run: pip install -r requirements.txt -r testrequirements.txt
      # Keeps repo_url/repo_name/edit_uri/brand icon and the README badge
      # row matching whichever remote this checkout is published from -
      # was sync_repo_icon.py, now provided by prodockit itself (#27).
      - run: prodockit sync-repo
      - run: prodockit pdf
      - run: zensical build --clean
      # After the builds, since these tests check the built PDF - they fail
      # the deploy if a Mermaid diagram or a formula reached it as raw
      # source instead of a rendered image (see test/ and issue #23).
      - run: python -m pytest test/ -v
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
