name: Documentation
on:
  push:
    branches:
      - main
  # No `release:` trigger here - see redeploy-after-release.yml. A release
  # event runs against `refs/tags/<tag>`, and a Pages deployment built from a
  # tag ref is silently never served: the API reports "success", nothing
  # fails, but the site just keeps showing the previous build indefinitely
  # (issue #43, same failure as prodockit-extensions#147). The fix is to
  # redeploy against `main` instead, which the workflow below does.
  workflow_dispatch:

# Publishing a release right after merging its version bump starts two
# deploys at once - one for the push, one for the release - and without a
# concurrency group they race. That happened to prodockit-extensions on its
# 0.15.1 release: the push run had checked out main before the tag existed,
# so its build saw the *previous* tag, and its deployment is the one that
# ended up live even though the release run started later, finished later,
# and reported success. Nothing failed; the site simply showed the wrong
# release number until someone noticed.
#
# `cancel-in-progress: false` rather than true: a queued deploy should wait
# and then supersede, not be discarded - losing the *later* deploy is
# exactly the failure here. Same pairing as GitHub's own Pages starter
# workflow. See prodockit-extensions#134.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
# Pandoc comes from the CI image or a setup action rather than
# requirements.txt, so `prodockit pins` cannot see it and it drifts
# silently. That is not hypothetical: pandoc 3.1.3 accepted `<pre><code>`
# containing element markup as a code block and 3.10 does not, so every
# fenced code block in the PDF reflowed as justified prose on a current
# pandoc while the build reported success
# (prodockit-extensions#207). This project was only unaffected because
# setup-pandoc happened to be installing 3.8.3.
#
# Pinned to the same version as prodockit-extensions and
# prodockit-template, so the family builds its PDFs with one pandoc.
env:
  PANDOC_VERSION: "3.10.1"

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    # Builds the site and the PDFs: about two minutes, eight and a half
    # at its slowest over 29 runs. The margin is for a slow build, not
    # for a stall - this job sat eleven minutes on `apt-get` and would
    # have held the runner for six hours (issue #130).
    timeout-minutes: 30
    # Consumed by the verify job below.
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      index_sha: ${{ steps.fingerprint.outputs.index_sha }}
    env:
      # Only needed so `prodockit pdf` can pre-render ```mermaid fenced code
      # blocks to static images via mermaid-cli/Puppeteer, and TeX maths
      # ($...$/$$...$$) to static images via mathjax-full (pure Node, no
      # browser needed for that one) - WeasyPrint has no JS engine to run
      # Mermaid.js/MathJax client-side like the live Zensical site does.
      # Without these, prodockit.pdf silently leaves both unrendered and the
      # PDF shows raw diagram/LaTeX source instead - see issue #23. Using the
      # apt-installed Google Chrome below instead of Puppeteer's own bundled
      # download avoids guessing at headless-Chrome shared-library package
      # names.
      #
      # PUPPETEER_SKIP_DOWNLOAD, not the older
      # PUPPETEER_SKIP_CHROMIUM_DOWNLOAD - Puppeteer renamed it, and
      # mermaid-cli ^11.4.2 resolves to puppeteer 25.x, which only honours
      # the new name. Using the old name silently downloads a full Chrome
      # build on every run before falling back to the apt one below.
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
        with:
          # Full history, not the default shallow clone - `{{ release }}`
          # comes from `git describe --tags`, which sees no tags at all in a
          # depth-1 checkout (prodockit-extensions#122).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          # One source of truth for local tooling and both CI hosts.
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: ${{ env.PANDOC_VERSION }}
      # The image's mirrorlist puts `azure.archive.ubuntu.com` first. When
      # that host is down - it was, repeatedly, on 2026-08-18, and it held
      # this workflow for eleven minutes before anyone noticed - apt spends
      # minutes on it before reaching the `archive.ubuntu.com` fallback,
      # which answers in milliseconds throughout. Neither a shorter connect
      # timeout nor fewer retries reached it in reasonable time, so the dead
      # host is taken out of the list instead
      # (prodockit-extensions#478, issue #130).
      #
      # Reported rather than assumed: if the image stops shipping a
      # mirrorlist, or stops using Azure, the run says so and carries on
      # unchanged - a substitution that quietly matched nothing would be
      # worse than either.
      - name: Point apt at a mirror that answers
        timeout-minutes: 2
        run: |
          list=/etc/apt/apt-mirrors.txt
          if [ ! -f "$list" ]; then
            echo "::notice::no $list in this image - apt left as it is"
          elif ! grep -q 'azure.archive.ubuntu.com' "$list"; then
            echo "::notice::$list no longer names Azure - apt left as it is"
          else
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$list"
            echo "mirrorlist now:"; cat "$list"
          fi
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0
        timeout-minutes: 8
      - run: curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor | sudo tee /usr/share/keyrings/google-chrome.gpg > /dev/null
      - run: echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
      - run: sudo apt-get update && sudo apt-get install -y google-chrome-stable
        timeout-minutes: 8
      - run: npm ci --prefix tools/mermaid
      - run: npm ci --prefix tools/mathjax
      # MathJax for the *website*, from the very install above. Neither
      # file is committed - the bundle is third-party code, and both are
      # written by `prodockit bootstrap` on a developer's machine
      # (prodockit-extensions#263) - so CI has to install them the same
      # way. Without this the site builds with a dangling script reference
      # and shows raw TeX where an equation should be.
      - name: Install MathJax for the website
        run: |
          mkdir -p docs/javascripts/vendor/mathjax
          cp tools/mathjax/node_modules/mathjax-full/es5/tex-svg-full.js \
             docs/javascripts/vendor/mathjax/
          cp tools/mathjax/node_modules/mathjax-full/LICENSE \
             docs/javascripts/vendor/mathjax/
          cat > docs/javascripts/mathjax.js <<'MATHJAX'
          // Written by CI, matching what `prodockit bootstrap` writes. Loaded
          // *before* the MathJax bundle: MathJax reads `window.MathJax` once at
          // startup, so a config arriving afterwards is ignored.
          window.MathJax = {
            tex: {
              processEscapes: true,
              processEnvironments: true,
            },
            options: {
              ignoreHtmlClass: ".*|",
              processHtmlClass: "arithmatex",
            },
          };
          MATHJAX
      - run: pip install -r requirements.txt -r testrequirements.txt
      # Offline and non-writing: keeps every declaration consistent and also
      # checks manifest-managed files against this installed Prodockit
      # release. A failure names the drift and prints its recovery command.
      - run: prodockit pins --check --offline
      # Keeps repo_url/repo_name/edit_uri/brand icon and the README badge
      # row matching whichever remote this checkout is published from -
      # was sync_repo_icon.py, now provided by prodockit itself (#27).
      - run: prodockit sync-repo
      - run: prodockit pdf
      - run: zensical build --clean --strict
      # After the builds, since these tests check the built PDF - they fail
      # the deploy if a Mermaid diagram or a formula reached it as raw
      # source instead of a rendered image (see test/ and issue #23).
      - run: python -m pytest test/ -v
      # Fingerprint what we are about to publish, so the verify job below can
      # tell whether the live site is actually serving *this* build. Taken
      # from the same directory upload-pages-artifact packs, immediately
      # before it packs it.
      - id: fingerprint
        run: echo "index_sha=$(sha256sum public/index.html | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment

  # A successful deploy does not mean the site serves it. Both the 1.2.0 and
  # 1.2.1 releases published fine from a tag-ref deploy and then kept
  # serving the previous build (issue #43) - the deployment reported
  # `success`, and the origin carried on returning the old bytes until
  # someone noticed and re-ran this workflow by hand. Nothing in the run
  # itself was wrong, so nothing went red.
  #
  # #43's fix (redeploying against `main` instead of a tag ref) removes that
  # specific cause, but not the general risk: a successful deploy job is
  # still not proof of delivery. This closes that gap directly - compare the
  # live page against the fingerprint of the build just uploaded, and fail
  # the run if they never converge. Separate job rather than another step,
  # so the deploy itself is never gated on delivery - the artifact is
  # published either way, and this only decides whether the run reports
  # success. Ported from prodockit-extensions#142.
  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    # Deliberately above the polling window below: this job waits out
    # Pages' ten-minute cache for up to fifteen minutes, so a limit
    # under that would cut short a wait that is working.
    timeout-minutes: 25
    steps:
      # Pages serves `cache-control: max-age=600`, so up to ~10 minutes of
      # staleness is normal and expected rather than a fault. 15 minutes of
      # polling clears that window with room to spare; past it, every
      # occurrence so far has needed a manual redeploy. A `?cb=` query
      # buster would not help - the CDN normalises query strings - so this
      # waits the TTL out rather than trying to defeat it.
      - name: Verify the live site serves this build
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          WANT: ${{ needs.deploy.outputs.index_sha }}
        run: |
          set -u
          for attempt in $(seq 1 30); do
            # Download to a file rather than piping or capturing. Piping into
            # sha256sum reports the *pipe's* exit status, so a failed fetch
            # silently hashes empty input instead of being noticed; capturing
            # the body in $(...) strips its trailing newline, so the hash
            # would never match the file on disk.
            if curl -fsSL --max-time 30 -o live-index.html "$PAGE_URL"; then
              got=$(sha256sum live-index.html | cut -d' ' -f1)
            else
              got="fetch-failed"
            fi
            if [ "$got" = "$WANT" ]; then
              echo "Live after ~$(( (attempt - 1) * 30 ))s: $PAGE_URL is serving this build."
              exit 0
            fi
            echo "attempt $attempt/30: live index.html is $got, want $WANT"
            sleep 30
          done
          # One line: a ::error:: annotation is terminated by the newline, and
          # a backslash continuation would fold this block's own indentation
          # into the message as runs of spaces.
          echo "::error::$PAGE_URL is not serving this build after 15 minutes. The deploy succeeded but delivery did not. Re-run with: gh workflow run docs.yml --ref main"
          echo "Live page headers for diagnosis (last-modified predating this run means the old build is still being served):"
          curl -sI "$PAGE_URL" | grep -iE 'last-modified|etag|age' || true
          exit 1
