name: Feature request
description: Suggest a topic, clarification, or improvement to the User Guide
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's missing or unclear?
      description: What are you trying to do that the guide doesn't currently cover well?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see added or changed? Include examples if helpful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you've thought about.
    validations:
      required: false
